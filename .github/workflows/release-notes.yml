name: Release Notes

on:
  push:
    branches: [master]
    paths:
      - .github/RELEASE_NOTES.md
      - project.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -nE 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/p' project.yml | head -1)
          [[ "$version" =~ ^[0-9A-Za-z][0-9A-Za-z.-]*$ ]] || { echo "Invalid MARKETING_VERSION: '$version'" >&2; exit 1; }

          notes=".github/RELEASE_NOTES.md"
          expected="# SimCam Lite $version"
          actual=$(sed -n '/[^[:space:]]/{p;q;}' "$notes")
          [[ "$actual" == "$expected" ]] || { echo "$notes must start with '$expected' (found '$actual')" >&2; exit 1; }

          tag="v$version"
          if is_draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$is_draft" == "true" ]]; then
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "SimCam Lite $version" --notes-file "$notes"
              echo "Updated draft release $tag"
            else
              echo "Release $tag is already published; bump MARKETING_VERSION for the next release"
            fi
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "SimCam Lite $version" --notes-file "$notes" --draft
            echo "Created draft release $tag"
          fi
