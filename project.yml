name: SimCamLite
options:
  bundleIdPrefix: dev.ifateam.simcamlite
  deploymentTarget:
    iOS: "16.0"
    macOS: "14.0"
  createIntermediateGroups: true
# Team, feed URL and Sparkle key come from the gitignored Config/Environment.xcconfig.
configFiles:
  Debug: Config/SimCamLite.xcconfig
  Release: Config/SimCamLite.xcconfig
packages:
  ArgumentParser:
    url: https://github.com/apple/swift-argument-parser
    from: 1.5.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
settings:
  base:
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_OBJC_ARC: YES
targets:
  SimCamLiteInject:
    type: framework
    platform: iOS
    sources:
      - path: Inject
        excludes:
          - SCLRuntimeMRC.m
      - path: Inject/SCLRuntimeMRC.m
        compilerFlags: [-fno-objc-arc]
      - path: Shared
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ifateam.simcamlite.inject
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(SIMCAM_DEVELOPMENT_TEAM)
        PROVISIONING_PROFILE_SPECIFIER: ""
        SUPPORTED_PLATFORMS: iphonesimulator
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS: $(SRCROOT)/Shared
        DEFINES_MODULE: NO
        SKIP_INSTALL: YES
        GCC_WARN_UNUSED_VARIABLE: YES
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: CoreImage.framework
      - sdk: UIKit.framework
      - sdk: ImageIO.framework
      - sdk: QuartzCore.framework
  SimCamLiteLoader:
    type: library.dynamic
    platform: iOS
    sources:
      - Loader
    settings:
      base:
        SUPPORTED_PLATFORMS: iphonesimulator
        EXECUTABLE_PREFIX: ""
        PRODUCT_NAME: SimCamLiteLoader
        SKIP_INSTALL: YES
  SimCamLite:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - SimCamLite.icon
      - path: App/SimCamLite.icon
        type: file
        buildPhase: resources
      - HostBridge
      - Common
      - path: Shared
        buildPhase: none
      # Shown in the What's New sheet; the same file feeds the appcast and the GitHub Release.
      - path: .github/RELEASE_NOTES.md
        buildPhase: resources
    dependencies:
      - target: simcam
        embed: true
        codeSign: true
        copy:
          destination: executables
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ifateam.simcamlite
        PRODUCT_NAME: SimCamLite
        ASSETCATALOG_COMPILER_APPICON_NAME: SimCamLite
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_NSCameraUsageDescription: SimCamLite uses the Mac camera as a video source for iOS Simulator apps.
        INFOPLIST_KEY_CFBundleDisplayName: SimCam Lite
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: HostBridge/SimCamLite-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Shared
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: App/SimCamLite.entitlements
        DEVELOPMENT_TEAM: $(SIMCAM_DEVELOPMENT_TEAM)
        PROVISIONING_PROFILE_SPECIFIER: ""
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: Apple Development
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
    postBuildScripts:
      - name: Embed SimCamLiteInject
        script: '"$SRCROOT/scripts/embed-inject.sh"'
        basedOnDependencyAnalysis: false
  simcam:
    type: tool
    platform: macOS
    sources:
      - CLI
      - Common
      - App/Engine/SimulatorManager.swift
      - App/Engine/InjectInstaller.swift
      - path: Shared
        buildPhase: none
    dependencies:
      - package: ArgumentParser
    settings:
      base:
        PRODUCT_NAME: simcam
        PRODUCT_BUNDLE_IDENTIFIER: dev.ifateam.simcamlite.cli
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: CLI/simcam-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Shared
        ENABLE_HARDENED_RUNTIME: YES
        DEVELOPMENT_TEAM: $(SIMCAM_DEVELOPMENT_TEAM)
        PROVISIONING_PROFILE_SPECIFIER: ""
        SKIP_INSTALL: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: Apple Development
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
schemes:
  SimCamLite:
    build:
      targets:
        SimCamLite: all
  simcam:
    build:
      targets:
        simcam: all
  SimCamLiteInject:
    build:
      targets:
        SimCamLiteInject: all
        SimCamLiteLoader: all
